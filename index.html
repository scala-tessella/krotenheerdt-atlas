    <h1>The atlas of the Krötenheerdt honeycombs</h1>
    <p>
      An atlas of the 570 k-uniform Krötenheerdt honeycombs of Euclidean 3-space: the face-to-face honeycombs by
      unit-edge convex uniform polyhedra whose vertices fall into exactly k orbits carrying k pairwise distinct
      vertex stars. Each class is drawn in 3D from its certified realization and identified by its minimal
      Delaney–Dress symbol. The atlas needs JavaScript to draw them.
    </p>
    <p>
      The number of such honeycombs is 28, 57, 119, 146, 122, 78, 18 and 2 for k = 1 to 8, and 0 from k = 9 on. The
      planar Krötenheerdt sequence, 11, 20, 39, 33, 15, 10, 7 and then 0, sits inside it: every planar tiling appears
      as its prismatic lift, and the three-dimensional sequence vanishes one row after the planar one.
    </p>
