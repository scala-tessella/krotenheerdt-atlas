# Builds the atlas and deploys it to Cloudflare Pages (the atlas.tessell.art project). Needs the repository secrets
# CLOUDFLARE_API_TOKEN (a token with the Cloudflare Pages: Edit permission) and CLOUDFLARE_ACCOUNT_ID. It runs only
# when started by hand (Actions > deploy > Run workflow): it tests and builds, and deploys to production when started
# on main.
name: deploy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Test
        run: sbt -batch test
      - name: Data bundle
        run: scripts/fetch-data.sh
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=krotenheerdt-atlas --branch=main
